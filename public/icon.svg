<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background - Sharp Corners -->
  <rect width="512" height="512" fill="#0f172a"/>
  
  <!-- Focus Corners - Sharp Right Angles -->
  <path d="M140 100 H100 V140" stroke="url(#grad1)" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter" />
  <path d="M372 100 H412 V140" stroke="url(#grad1)" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter" />
  <path d="M140 412 H100 V372" stroke="url(#grad1)" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter" />
  <path d="M372 412 H412 V372" stroke="url(#grad1)" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter" />
  
  <!-- Stylized QR Code Pattern - Square Elements -->
  <g fill="white">
    <!-- Top Left Finder Pattern -->
    <path d="M160 160 H220 V220 H160 V160 Z M175 175 V205 H205 V175 H175 Z M185 185 H195 V195 H185 V185 Z" />
    <!-- Top Right Finder Pattern -->
    <path d="M292 160 H352 V220 H292 V160 Z M307 175 V205 H337 V175 H307 Z M317 185 H327 V195 H317 V185 Z" />
    <!-- Bottom Left Finder Pattern -->
    <path d="M160 292 H220 V352 H160 V292 Z M175 307 V337 H205 V307 H175 Z M185 317 H195 V327 H185 V317 Z" />
    
    <!-- Data Bits - Sharp Squares -->
    <rect x="240" y="160" width="15" height="15" />
    <rect x="265" y="175" width="15" height="15" />
    <rect x="240" y="205" width="15" height="15" />
    <rect x="292" y="240" width="15" height="15" />
    <rect x="337" y="240" width="15" height="15" />
    <rect x="160" y="240" width="15" height="15" />
    <rect x="240" y="292" width="15" height="15" />
    <rect x="265" y="315" width="15" height="15" />
    <rect x="330" y="330" width="22" height="22" />
    <rect x="292" y="292" width="30" height="30" fill="url(#grad1)" />
  </g>
  
  <!-- Static Scanning Line - Sharp Edges -->
  <rect x="80" y="252" width="352" height="8" fill="url(#grad1)" filter="url(#glow)" />
</svg>