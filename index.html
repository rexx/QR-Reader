<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR READER</title>

    <!-- PWA icons served from this repo public/ dir -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="./manifest.json">

    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <!-- Critical shell styles: inline so the first paint needs no stylesheet -->
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; background-color: #020617; color: #f8fafc; }
        #boot-shell {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background-color: #020617;
        }
        #boot-shell > div {
            width: 66vw; max-width: 320px; aspect-ratio: 1; border-radius: 3rem;
            border: 4px solid #1e293b; background-color: #0f172a;
        }
    </style>

    <!-- Camera warm-up: fires while the JS bundle is still downloading so
         getUserMedia permission and sensor spin-up overlap with app boot.
         QRScanner claims this stream instead of opening its own. -->
    <script>
        window.__cameraWarmup = navigator.mediaDevices
            ? navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
              }).catch(function () { return null; })
            : Promise.resolve(null);
    </script>
</head>
<body>
    <div id="boot-shell"><div></div></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
